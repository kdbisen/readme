# Test Configuration for Banking Onboarding Service
# This file contains test-specific properties

# Server Configuration
server.port=0
server.servlet.context-path=/

# MongoDB Configuration for Tests
spring.data.mongodb.uri=mongodb://localhost:27017/banking_onboarding_test
spring.data.mongodb.auto-index-creation=true

# Logging Configuration
logging.level.com.banking.onboarding=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# HTTP Client Configuration
http.client.timeout=30000
http.client.connection-timeout=5000
http.client.read-timeout=30000

# JWT Token Service Configuration
auth.token-service.url=http://localhost:8080/auth/token
auth.token-service.timeout=10000
auth.token-service.cache-ttl=300000

# Proxy Configuration
proxy.service.url=http://localhost:8080/proxy
proxy.service.timeout=30000
proxy.service.retry-attempts=3

# Endpoint Configuration
endpoints.config.file=classpath:endpoints-test.properties

# Test-specific Properties
test.correlation-id.prefix=TEST-CORR
test.process-id.prefix=TEST-PROC
test.max-wait-time=30000
test.poll-interval=1000

# Disable Security for Tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
