# Test Endpoints Configuration
# This file contains test-specific endpoint configurations

# Apigee Service Endpoints
apigee.transform.url=${APIGEE_BASE_URL:http://localhost:8080}/transform/xml-to-json
apigee.transform.method=POST
apigee.transform.timeout=30000
apigee.transform.retry-attempts=3
apigee.transform.auth-required=false

# Fenergo Entity Service Endpoints
fenergo.entity.create.url=${FENERGO_BASE_URL:http://localhost:8080}/fenergo/entity/create
fenergo.entity.create.method=POST
fenergo.entity.create.timeout=30000
fenergo.entity.create.retry-attempts=3
fenergo.entity.create.auth-required=true
fenergo.entity.create.auth-type=JWT

# Fenergo Journey Service Endpoints
fenergo.journey.info.url=${FENERGO_BASE_URL:http://localhost:8080}/fenergo/journey/info
fenergo.journey.info.method=GET
fenergo.journey.info.timeout=30000
fenergo.journey.info.retry-attempts=3
fenergo.journey.info.auth-required=true
fenergo.journey.info.auth-type=JWT

fenergo.journey.initiate.url=${FENERGO_BASE_URL:http://localhost:8080}/fenergo/journey/initiate
fenergo.journey.initiate.method=POST
fenergo.journey.initiate.timeout=30000
fenergo.journey.initiate.retry-attempts=3
fenergo.journey.initiate.auth-required=true
fenergo.journey.initiate.auth-type=JWT

fenergo.journey.details.url=${FENERGO_BASE_URL:http://localhost:8080}/fenergo/journey/details
fenergo.journey.details.method=GET
fenergo.journey.details.timeout=30000
fenergo.journey.details.retry-attempts=3
fenergo.journey.details.auth-required=true
fenergo.journey.details.auth-type=JWT

# Test Mock Endpoints
test.mock.apigee.url=http://localhost:8080/mock/apigee
test.mock.fenergo.url=http://localhost:8080/mock/fenergo
test.mock.jwt.url=http://localhost:8080/mock/jwt
