# Production Configuration
spring.profiles.active=prod

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1
server.servlet.session.timeout=30m
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/xml,text/plain

# MongoDB Configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:banking_onboarding}
spring.data.mongodb.username=${MONGODB_USERNAME:}
spring.data.mongodb.password=${MONGODB_PASSWORD:}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:admin}
spring.data.mongodb.auto-index-creation=false

# Logging Configuration
logging.level.com.banking.onboarding=INFO
logging.level.org.springframework.integration=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE_PATH:/var/log/banking-onboarding-service/application.log}
logging.file.max-size=100MB
logging.file.max-history=30

# Fenergo Integration Configuration
fenergo.api.base-url=${FENERGO_API_URL:http://fenergo-service:8080/api}
fenergo.api.timeout=${FENERGO_API_TIMEOUT:30000}
fenergo.api.retry-attempts=${FENERGO_API_RETRY:3}
fenergo.api.connection-timeout=${FENERGO_CONNECTION_TIMEOUT:10000}
fenergo.api.read-timeout=${FENERGO_READ_TIMEOUT:30000}

# Process Configuration
process.async.timeout=${PROCESS_TIMEOUT:300000}
process.max-concurrent=${MAX_CONCURRENT_PROCESSES:10}
process.queue-capacity=${QUEUE_CAPACITY:100}

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.server.port=8081

# Jackson Configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Validation Configuration
spring.validation.enabled=true

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN
