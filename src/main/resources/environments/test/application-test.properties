# Test Environment Configuration
# ===========================================

# Server Configuration
server.port=8081
server.servlet.context-path=/banking-onboarding

# MongoDB Configuration - Test
spring.data.mongodb.host=test-mongodb.example.com
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_test
spring.data.mongodb.authentication-database=admin
MONGODB_URI=mongodb://test-mongodb.example.com:27017/banking_onboarding_test

# Logging Configuration - Test
logging.level.com.banking.onboarding=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.config=classpath:logback-test.xml
ENVIRONMENT=test
APP_VERSION=1.0.0-test

# Step Configuration - Test
onboarding.steps.definition=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.execution.order=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.retry.enabled=true
onboarding.steps.retry.max-retries=2
onboarding.steps.retry.delay-ms=500
onboarding.steps.retry.backoff-multiplier=1.5
onboarding.steps.timeout-ms=20000

# Fenergo URLs - Test
fenergo.entity.api.url=https://test-fenergo.example.com/entity
fenergo.logic.engine.url=https://test-fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://test-fenergo.example.com/journeycommand/api/journey/launch

# Fenergo Configuration - Test
fenergo.tenant.id=test-tenant
fenergo.journey.type.filter=CLIENT_ONBOARDING

# Apigee URLs - Test
apigee.transformation.endpoint=https://test-apigee.example.com/transform
apigee.auth.token-service.url=https://test-apigee.example.com/oauth/token

# Apigee Configuration - Test
apigee.transformation.auth-scope=transform:read
apigee.auth.client-id=test-client-id
apigee.auth.client-secret=test-client-secret
apigee.auth.default-scope=default
apigee.auth.cache-enabled=true

# Fenergo Auth - Test
fenergo.auth.token-service.url=https://test-fenergo.example.com/oauth/token
fenergo.auth.client-id=test-fenergo-client
fenergo.auth.client-secret=test-fenergo-secret
fenergo.auth.default-scope=fenergo:read
fenergo.auth.scope=fenergo:read,fenergo:write
fenergo.auth.cache-enabled=true

# HTTP Client Configuration - Test
restclient.timeout.connection=3000
restclient.timeout.read=20000
restclient.timeout.write=20000

# Jackson Configuration - Test
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
