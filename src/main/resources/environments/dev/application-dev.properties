# Development Environment Configuration
# ===========================================

# Server Configuration
server.port=8080
server.servlet.context-path=/banking-onboarding

# MongoDB Configuration - Development
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_dev
spring.data.mongodb.authentication-database=admin
MONGODB_URI=mongodb://localhost:27017/banking_onboarding_dev

# Logging Configuration - Development
logging.level.com.banking.onboarding=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.config=classpath:logback-dev.xml
ENVIRONMENT=development
APP_VERSION=1.0.0-dev

# Step Configuration - Development
onboarding.steps.definition=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.execution.order=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.retry.enabled=true
onboarding.steps.retry.max-retries=3
onboarding.steps.retry.delay-ms=1000
onboarding.steps.retry.backoff-multiplier=2.0
onboarding.steps.timeout-ms=30000

# Fenergo URLs - Development
fenergo.entity.api.url=https://dev-fenergo.example.com/entity
fenergo.logic.engine.url=https://dev-fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://dev-fenergo.example.com/journeycommand/api/journey/launch

# Fenergo Configuration - Development
fenergo.tenant.id=dev-tenant
fenergo.journey.type.filter=CLIENT_ONBOARDING

# Apigee URLs - Development
apigee.transformation.endpoint=https://dev-apigee.example.com/transform
apigee.auth.token-service.url=https://dev-apigee.example.com/oauth/token

# Apigee Configuration - Development
apigee.transformation.auth-scope=transform:read
apigee.auth.client-id=dev-client-id
apigee.auth.client-secret=dev-client-secret
apigee.auth.default-scope=default
apigee.auth.cache-enabled=true

# Fenergo Auth - Development
fenergo.auth.token-service.url=https://dev-fenergo.example.com/oauth/token
fenergo.auth.client-id=dev-fenergo-client
fenergo.auth.client-secret=dev-fenergo-secret
fenergo.auth.default-scope=fenergo:read
fenergo.auth.scope=fenergo:read,fenergo:write
fenergo.auth.cache-enabled=true

# HTTP Client Configuration - Development
restclient.timeout.connection=5000
restclient.timeout.read=30000
restclient.timeout.write=30000

# Jackson Configuration - Development
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
