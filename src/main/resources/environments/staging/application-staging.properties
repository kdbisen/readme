# Staging Environment Configuration
# ===========================================

# Server Configuration
server.port=8080
server.servlet.context-path=/banking-onboarding

# MongoDB Configuration - Staging
spring.data.mongodb.host=staging-mongodb.example.com
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_staging
spring.data.mongodb.authentication-database=admin
MONGODB_URI=mongodb://staging-mongodb.example.com:27017/banking_onboarding_staging

# Logging Configuration - Staging
logging.level.com.banking.onboarding=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.config=classpath:logback-staging.xml
ENVIRONMENT=staging
APP_VERSION=1.0.0-staging

# Step Configuration - Staging
onboarding.steps.definition=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.execution.order=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.retry.enabled=true
onboarding.steps.retry.max-retries=3
onboarding.steps.retry.delay-ms=1000
onboarding.steps.retry.backoff-multiplier=2.0
onboarding.steps.timeout-ms=30000

# Fenergo URLs - Staging
fenergo.entity.api.url=https://staging-fenergo.example.com/entity
fenergo.logic.engine.url=https://staging-fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://staging-fenergo.example.com/journeycommand/api/journey/launch

# Fenergo Configuration - Staging
fenergo.tenant.id=staging-tenant
fenergo.journey.type.filter=CLIENT_ONBOARDING

# Apigee URLs - Staging
apigee.transformation.endpoint=https://staging-apigee.example.com/transform
apigee.auth.token-service.url=https://staging-apigee.example.com/oauth/token

# Apigee Configuration - Staging
apigee.transformation.auth-scope=transform:read
apigee.auth.client-id=staging-client-id
apigee.auth.client-secret=staging-client-secret
apigee.auth.default-scope=default
apigee.auth.cache-enabled=true

# Fenergo Auth - Staging
fenergo.auth.token-service.url=https://staging-fenergo.example.com/oauth/token
fenergo.auth.client-id=staging-fenergo-client
fenergo.auth.client-secret=staging-fenergo-secret
fenergo.auth.default-scope=fenergo:read
fenergo.auth.scope=fenergo:read,fenergo:write
fenergo.auth.cache-enabled=true

# HTTP Client Configuration - Staging
restclient.timeout.connection=5000
restclient.timeout.read=30000
restclient.timeout.write=30000

# Jackson Configuration - Staging
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
