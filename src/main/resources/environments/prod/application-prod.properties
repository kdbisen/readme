# Production Environment Configuration
# ===========================================

# Server Configuration
server.port=8080
server.servlet.context-path=/banking-onboarding

# MongoDB Configuration - Production
spring.data.mongodb.host=prod-mongodb.example.com
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_prod
spring.data.mongodb.authentication-database=admin
MONGODB_URI=mongodb://prod-mongodb.example.com:27017/banking_onboarding_prod

# Logging Configuration - Production
logging.level.com.banking.onboarding=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.data.mongodb=ERROR
logging.config=classpath:logback-prod.xml
ENVIRONMENT=production
APP_VERSION=1.0.0-prod

# Step Configuration - Production
onboarding.steps.definition=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.execution.order=XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH
onboarding.steps.retry.enabled=true
onboarding.steps.retry.max-retries=5
onboarding.steps.retry.delay-ms=2000
onboarding.steps.retry.backoff-multiplier=2.5
onboarding.steps.timeout-ms=60000

# Fenergo URLs - Production
fenergo.entity.api.url=https://fenergo.example.com/entity
fenergo.logic.engine.url=https://fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://fenergo.example.com/journeycommand/api/journey/launch

# Fenergo Configuration - Production
fenergo.tenant.id=prod-tenant
fenergo.journey.type.filter=CLIENT_ONBOARDING

# Apigee URLs - Production
apigee.transformation.endpoint=https://apigee.example.com/transform
apigee.auth.token-service.url=https://apigee.example.com/oauth/token

# Apigee Configuration - Production
apigee.transformation.auth-scope=transform:read
apigee.auth.client-id=${APIGEE_CLIENT_ID}
apigee.auth.client-secret=${APIGEE_CLIENT_SECRET}
apigee.auth.default-scope=default
apigee.auth.cache-enabled=true

# Fenergo Auth - Production
fenergo.auth.token-service.url=https://fenergo.example.com/oauth/token
fenergo.auth.client-id=${FENERGO_CLIENT_ID}
fenergo.auth.client-secret=${FENERGO_CLIENT_SECRET}
fenergo.auth.default-scope=fenergo:read
fenergo.auth.scope=fenergo:read,fenergo:write
fenergo.auth.cache-enabled=true

# HTTP Client Configuration - Production
restclient.timeout.connection=10000
restclient.timeout.read=60000
restclient.timeout.write=60000

# Jackson Configuration - Production
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Security Configuration - Production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
