# Test Configuration
spring.profiles.active=test

# Server Configuration
server.port=0

# MongoDB Configuration (Embedded for testing)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_test

# Logging Configuration
logging.level.com.banking.onboarding=DEBUG
logging.level.org.springframework.integration=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Fenergo Integration Configuration (Mock)
fenergo.api.base-url=http://localhost:8081/mock-fenergo/api
fenergo.api.timeout=5000
fenergo.api.retry-attempts=1

# Process Configuration
process.async.timeout=30000
process.max-concurrent=5
process.queue-capacity=10

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
