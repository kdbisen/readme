# ===========================================
# PUBLIC ENDPOINTS (NO AUTH)
# ===========================================

# Health Check
endpoint.HEALTH_CHECK.name=HEALTH_CHECK
endpoint.HEALTH_CHECK.method=GET
endpoint.HEALTH_CHECK.path=/health
endpoint.HEALTH_CHECK.description=Health check endpoint
endpoint.HEALTH_CHECK.authRequired=false
endpoint.HEALTH_CHECK.timeoutMs=${HEALTH_CHECK_TIMEOUT:5000}
endpoint.HEALTH_CHECK.retryAttempts=${HEALTH_CHECK_RETRIES:1}

# API Info
endpoint.API_INFO.name=API_INFO
endpoint.API_INFO.method=GET
endpoint.API_INFO.path=/api/info
endpoint.API_INFO.description=API information
endpoint.API_INFO.authRequired=false
endpoint.API_INFO.timeoutMs=${API_INFO_TIMEOUT:5000}
endpoint.API_INFO.retryAttempts=${API_INFO_RETRIES:1}
