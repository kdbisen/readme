# ===========================================
# RISK ASSESSMENT
# ===========================================

# Assess Risk
endpoint.ASSESS_RISK.name=ASSESS_RISK
endpoint.ASSESS_RISK.method=POST
endpoint.ASSESS_RISK.path=/risk/assess
endpoint.ASSESS_RISK.description=Assess entity risk
endpoint.ASSESS_RISK.authRequired=true
endpoint.ASSESS_RISK.authScope=${ASSESS_RISK_AUTH_SCOPE:fenergo-risk-write}
endpoint.ASSESS_RISK.authType=JWT
