# API Endpoint Configuration with Environment Variables
# Format: endpoint.{name}.{property}=${ENV_VAR:default_value}

# ===========================================
# ENTITY MANAGEMENT ENDPOINTS
# ===========================================

# Create Entity
endpoint.CREATE_ENTITY.name=CREATE_ENTITY
endpoint.CREATE_ENTITY.method=POST
endpoint.CREATE_ENTITY.path=/entities
endpoint.CREATE_ENTITY.description=Create new entity
endpoint.CREATE_ENTITY.authRequired=true
endpoint.CREATE_ENTITY.authScope=${CREATE_ENTITY_AUTH_SCOPE:fenergo-entity-write}
endpoint.CREATE_ENTITY.authType=JWT
endpoint.CREATE_ENTITY.timeoutMs=${CREATE_ENTITY_TIMEOUT:30000}
endpoint.CREATE_ENTITY.retryAttempts=${CREATE_ENTITY_RETRIES:3}

# Get Entity
endpoint.GET_ENTITY.name=GET_ENTITY
endpoint.GET_ENTITY.method=GET
endpoint.GET_ENTITY.path=/entities/{entityId}
endpoint.GET_ENTITY.description=Get entity by ID
endpoint.GET_ENTITY.authRequired=true
endpoint.GET_ENTITY.authScope=${GET_ENTITY_AUTH_SCOPE:fenergo-entity-read}
endpoint.GET_ENTITY.authType=JWT
endpoint.GET_ENTITY.timeoutMs=${GET_ENTITY_TIMEOUT:15000}
endpoint.GET_ENTITY.retryAttempts=${GET_ENTITY_RETRIES:2}

# Update Entity
endpoint.UPDATE_ENTITY.name=UPDATE_ENTITY
endpoint.UPDATE_ENTITY.method=PUT
endpoint.UPDATE_ENTITY.path=/entities/{entityId}
endpoint.UPDATE_ENTITY.description=Update entity
endpoint.UPDATE_ENTITY.authRequired=true
endpoint.UPDATE_ENTITY.authScope=${UPDATE_ENTITY_AUTH_SCOPE:fenergo-entity-write}
endpoint.UPDATE_ENTITY.authType=JWT
endpoint.UPDATE_ENTITY.timeoutMs=${UPDATE_ENTITY_TIMEOUT:30000}
endpoint.UPDATE_ENTITY.retryAttempts=${UPDATE_ENTITY_RETRIES:3}

# Delete Entity
endpoint.DELETE_ENTITY.name=DELETE_ENTITY
endpoint.DELETE_ENTITY.method=DELETE
endpoint.DELETE_ENTITY.path=/entities/{entityId}
endpoint.DELETE_ENTITY.description=Delete entity
endpoint.DELETE_ENTITY.authRequired=true
endpoint.DELETE_ENTITY.authScope=${DELETE_ENTITY_AUTH_SCOPE:fenergo-entity-write}
endpoint.DELETE_ENTITY.authType=JWT
endpoint.DELETE_ENTITY.timeoutMs=${DELETE_ENTITY_TIMEOUT:20000}
endpoint.DELETE_ENTITY.retryAttempts=${DELETE_ENTITY_RETRIES:2}

# ===========================================
# KYC OPERATIONS
# ===========================================

# Submit KYC
endpoint.SUBMIT_KYC.name=SUBMIT_KYC
endpoint.SUBMIT_KYC.method=POST
endpoint.SUBMIT_KYC.path=/kyc/submit
endpoint.SUBMIT_KYC.description=Submit KYC documents
endpoint.SUBMIT_KYC.authRequired=true
endpoint.SUBMIT_KYC.authScope=${SUBMIT_KYC_AUTH_SCOPE:fenergo-kyc-write}
endpoint.SUBMIT_KYC.authType=JWT
endpoint.SUBMIT_KYC.timeoutMs=${SUBMIT_KYC_TIMEOUT:45000}
endpoint.SUBMIT_KYC.retryAttempts=${SUBMIT_KYC_RETRIES:3}

# Get KYC Status
endpoint.GET_KYC_STATUS.name=GET_KYC_STATUS
endpoint.GET_KYC_STATUS.method=GET
endpoint.GET_KYC_STATUS.path=/kyc/{entityId}/status
endpoint.GET_KYC_STATUS.description=Get KYC status
endpoint.GET_KYC_STATUS.authRequired=true
endpoint.GET_KYC_STATUS.authScope=${GET_KYC_STATUS_AUTH_SCOPE:fenergo-kyc-read}
endpoint.GET_KYC_STATUS.authType=JWT
endpoint.GET_KYC_STATUS.timeoutMs=${GET_KYC_STATUS_TIMEOUT:15000}
endpoint.GET_KYC_STATUS.retryAttempts=${GET_KYC_STATUS_RETRIES:2}

