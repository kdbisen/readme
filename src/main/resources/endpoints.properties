# Simple API Endpoint Configuration
# Just set these environment variables to override defaults:

# ===========================================
# MAIN ENDPOINTS
# ===========================================

# Submit KYC (most important endpoint)
endpoint.SUBMIT_KYC.name=SUBMIT_KYC
endpoint.SUBMIT_KYC.method=POST
endpoint.SUBMIT_KYC.path=/kyc/submit
endpoint.SUBMIT_KYC.description=Submit KYC documents
endpoint.SUBMIT_KYC.authRequired=true
endpoint.SUBMIT_KYC.authScope=${KYC_AUTH_SCOPE:fenergo-kyc-write}
endpoint.SUBMIT_KYC.timeoutMs=${KYC_TIMEOUT:30000}
endpoint.SUBMIT_KYC.retryAttempts=${KYC_RETRIES:3}

# Get KYC Status
endpoint.GET_KYC_STATUS.name=GET_KYC_STATUS
endpoint.GET_KYC_STATUS.method=GET
endpoint.GET_KYC_STATUS.path=/kyc/{entityId}/status
endpoint.GET_KYC_STATUS.description=Get KYC status
endpoint.GET_KYC_STATUS.authRequired=true
endpoint.GET_KYC_STATUS.authScope=${KYC_AUTH_SCOPE:fenergo-kyc-read}
endpoint.GET_KYC_STATUS.timeoutMs=${KYC_TIMEOUT:15000}
endpoint.GET_KYC_STATUS.retryAttempts=${KYC_RETRIES:2}

# Run Compliance Check
endpoint.RUN_COMPLIANCE_CHECK.name=RUN_COMPLIANCE_CHECK
endpoint.RUN_COMPLIANCE_CHECK.method=POST
endpoint.RUN_COMPLIANCE_CHECK.path=/compliance/check
endpoint.RUN_COMPLIANCE_CHECK.description=Run compliance check
endpoint.RUN_COMPLIANCE_CHECK.authRequired=true
endpoint.RUN_COMPLIANCE_CHECK.authScope=${COMPLIANCE_AUTH_SCOPE:fenergo-compliance-write}
endpoint.RUN_COMPLIANCE_CHECK.timeoutMs=${COMPLIANCE_TIMEOUT:60000}
endpoint.RUN_COMPLIANCE_CHECK.retryAttempts=${COMPLIANCE_RETRIES:2}

# Health Check (no auth needed)
endpoint.HEALTH_CHECK.name=HEALTH_CHECK
endpoint.HEALTH_CHECK.method=GET
endpoint.HEALTH_CHECK.path=/health
endpoint.HEALTH_CHECK.description=Health check endpoint
endpoint.HEALTH_CHECK.authRequired=false
endpoint.HEALTH_CHECK.timeoutMs=5000
endpoint.HEALTH_CHECK.retryAttempts=1
