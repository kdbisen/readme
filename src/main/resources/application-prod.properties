# Production Environment Configuration
# This file is loaded when spring.profiles.active=prod

# Production-optimized endpoint settings
# Longer timeouts for production reliability
endpoint.SUBMIT_KYC.timeoutMs=60000
endpoint.SUBMIT_KYC.retryAttempts=3
endpoint.GET_KYC_STATUS.timeoutMs=20000
endpoint.GET_KYC_STATUS.retryAttempts=2
endpoint.RUN_COMPLIANCE_CHECK.timeoutMs=120000
endpoint.RUN_COMPLIANCE_CHECK.retryAttempts=2
endpoint.ASSESS_RISK.timeoutMs=45000
endpoint.ASSESS_RISK.retryAttempts=3

# Production-specific endpoints
endpoint.PROD_MONITORING.name=PROD_MONITORING
endpoint.PROD_MONITORING.method=GET
endpoint.PROD_MONITORING.path=/monitoring/health
endpoint.PROD_MONITORING.description=Production monitoring endpoint
endpoint.PROD_MONITORING.authRequired=true
endpoint.PROD_MONITORING.authScope=fenergo-monitoring-read
endpoint.PROD_MONITORING.timeoutMs=5000
endpoint.PROD_MONITORING.retryAttempts=1

# Production security settings
endpoint.CREATE_ENTITY.authScope=fenergo-entity-write-prod
endpoint.UPDATE_ENTITY.authScope=fenergo-entity-write-prod
endpoint.DELETE_ENTITY.authScope=fenergo-entity-write-prod

# Production logging
logging.level.com.banking.onboarding.bridge=INFO
logging.level.com.banking.onboarding.auth=WARN
logging.level.org.springframework.web=WARN