# Production Environment Configuration
# ===========================================

# Override core settings for production
app.version=1.0.0-prod
ENVIRONMENT=production

# Server Configuration - Production
server.port=8080
server.servlet.session.cookie.secure=true

# Database Configuration - Production
spring.data.mongodb.host=prod-mongodb.example.com
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_prod
MONGODB_URI=mongodb://prod-mongodb.example.com:27017/banking_onboarding_prod

# Logging Configuration - Production
logging.level.com.banking.onboarding=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.data.mongodb=ERROR
logging.config=classpath:logback-prod.xml

# Fenergo Configuration - Production
fenergo.entity.api.url=https://fenergo.example.com/entity
fenergo.logic.engine.url=https://fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://fenergo.example.com/journeycommand/api/journey/launch
fenergo.tenant.id=prod-tenant
fenergo.auth.client-id=${FENERGO_CLIENT_ID}
fenergo.auth.client-secret=${FENERGO_CLIENT_SECRET}

# Apigee Configuration - Production
apigee.transformation.endpoint=https://apigee.example.com/transform
apigee.auth.token-service.url=https://apigee.example.com/oauth/token
apigee.auth.client-id=${APIGEE_CLIENT_ID}
apigee.auth.client-secret=${APIGEE_CLIENT_SECRET}

# Security Configuration - Production
security.ssl.enabled=true
security.cors.allowed-origins=https://prod.example.com
security.auth.enabled=true
security.auth.type=jwt
security.api.key.enabled=true

# Monitoring Configuration - Production
monitoring.metrics.enabled=true
monitoring.health.show-details=when-authorized
monitoring.tracing.enabled=true
monitoring.tracing.sampling.probability=0.01
monitoring.alerts.enabled=true

# Step Configuration - Production
onboarding.steps.retry.max-retries=5
onboarding.steps.timeout-ms=60000
onboarding.steps.async.enabled=true

# HTTP Client Configuration - Production
restclient.timeout.read=60000
restclient.logging.enabled=false
restclient.logging.level=WARN
restclient.circuit-breaker.enabled=true

