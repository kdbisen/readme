# Development Environment Configuration
# ===========================================

# Override core settings for development
app.version=1.0.0-dev
ENVIRONMENT=development

# Server Configuration - Development
server.port=8080
server.servlet.session.cookie.secure=false

# Database Configuration - Development
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_dev
MONGODB_URI=mongodb://localhost:27017/banking_onboarding_dev

# Logging Configuration - Development
logging.level.com.banking.onboarding=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.config=classpath:logback-dev.xml

# Fenergo Configuration - Development
fenergo.entity.api.url=https://dev-fenergo.example.com/entity
fenergo.logic.engine.url=https://dev-fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://dev-fenergo.example.com/journeycommand/api/journey/launch
fenergo.tenant.id=dev-tenant
fenergo.auth.client-id=dev-fenergo-client
fenergo.auth.client-secret=dev-fenergo-secret

# Apigee Configuration - Development
apigee.transformation.endpoint=https://dev-apigee.example.com/transform
apigee.auth.token-service.url=https://dev-apigee.example.com/oauth/token
apigee.auth.client-id=dev-client-id
apigee.auth.client-secret=dev-client-secret

# Security Configuration - Development
security.ssl.enabled=false
security.cors.allowed-origins=*
security.auth.enabled=false

# Monitoring Configuration - Development
monitoring.metrics.enabled=true
monitoring.health.show-details=always
monitoring.tracing.enabled=true
monitoring.tracing.sampling.probability=1.0

# Step Configuration - Development
onboarding.steps.retry.max-retries=3
onboarding.steps.timeout-ms=30000
onboarding.steps.async.enabled=false

# HTTP Client Configuration - Development
restclient.timeout.read=30000
restclient.logging.enabled=true
restclient.logging.level=DEBUG
