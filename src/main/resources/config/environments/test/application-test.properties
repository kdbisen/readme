# Test Environment Configuration
# ===========================================

# Override core settings for test
app.version=1.0.0-test
ENVIRONMENT=test

# Server Configuration - Test
server.port=8081
server.servlet.session.cookie.secure=false

# Database Configuration - Test
spring.data.mongodb.host=test-mongodb.example.com
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding_test
MONGODB_URI=mongodb://test-mongodb.example.com:27017/banking_onboarding_test

# Logging Configuration - Test
logging.level.com.banking.onboarding=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.config=classpath:logback-test.xml

# Fenergo Configuration - Test
fenergo.entity.api.url=https://test-fenergo.example.com/entity
fenergo.logic.engine.url=https://test-fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://test-fenergo.example.com/journeycommand/api/journey/launch
fenergo.tenant.id=test-tenant
fenergo.auth.client-id=test-fenergo-client
fenergo.auth.client-secret=test-fenergo-secret

# Apigee Configuration - Test
apigee.transformation.endpoint=https://test-apigee.example.com/transform
apigee.auth.token-service.url=https://test-apigee.example.com/oauth/token
apigee.auth.client-id=test-client-id
apigee.auth.client-secret=test-client-secret

# Security Configuration - Test
security.ssl.enabled=false
security.cors.allowed-origins=*
security.auth.enabled=false

# Monitoring Configuration - Test
monitoring.metrics.enabled=true
monitoring.health.show-details=when-authorized
monitoring.tracing.enabled=false

# Step Configuration - Test
onboarding.steps.retry.max-retries=2
onboarding.steps.timeout-ms=20000
onboarding.steps.async.enabled=false

# HTTP Client Configuration - Test
restclient.timeout.read=20000
restclient.logging.enabled=true
restclient.logging.level=INFO
