# Monitoring Configuration
# ===========================================

# Metrics Configuration
monitoring.metrics.enabled=true
monitoring.metrics.export.prometheus.enabled=true
monitoring.metrics.export.prometheus.endpoint=/actuator/prometheus
monitoring.metrics.export.jmx.enabled=true
monitoring.metrics.export.jmx.domain=banking.onboarding

# Health Check Configuration
monitoring.health.enabled=true
monitoring.health.show-details=when-authorized
monitoring.health.show-components=always
monitoring.health.db.enabled=true
monitoring.health.disk-space.enabled=true
monitoring.health.disk-space.threshold=100MB

# Tracing Configuration
monitoring.tracing.enabled=false
monitoring.tracing.sampling.probability=0.1
monitoring.tracing.zipkin.enabled=false
monitoring.tracing.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Performance Monitoring
monitoring.performance.enabled=true
monitoring.performance.slow-query-threshold=1000ms
monitoring.performance.slow-request-threshold=2000ms
monitoring.performance.memory-threshold=80%

# Alerting Configuration
monitoring.alerts.enabled=false
monitoring.alerts.email.enabled=false
monitoring.alerts.email.recipients=
monitoring.alerts.slack.enabled=false
monitoring.alerts.slack.webhook-url=

# Custom Metrics
monitoring.custom-metrics.enabled=true
monitoring.custom-metrics.step-execution-time.enabled=true
monitoring.custom-metrics.api-response-time.enabled=true
monitoring.custom-metrics.error-rate.enabled=true
monitoring.custom-metrics.throughput.enabled=true
