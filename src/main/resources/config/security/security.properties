# Security Configuration
# ===========================================

# SSL/TLS Configuration
security.ssl.enabled=false
security.ssl.keystore.path=
security.ssl.keystore.password=
security.ssl.keystore.type=PKCS12
security.ssl.truststore.path=
security.ssl.truststore.password=
security.ssl.truststore.type=PKCS12
security.ssl.certificate-validation.enabled=true

# CORS Configuration
security.cors.enabled=true
security.cors.allowed-origins=*
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=*
security.cors.allow-credentials=true
security.cors.max-age=3600

# Authentication Configuration
security.auth.enabled=false
security.auth.type=none
security.auth.jwt.secret=
security.auth.jwt.expiration=3600
security.auth.jwt.refresh-expiration=86400

# Authorization Configuration
security.authorization.enabled=false
security.authorization.role-based.enabled=false
security.authorization.permission-based.enabled=false

# API Security
security.api.key.enabled=false
security.api.key.header=X-API-Key
security.api.key.value=

# Rate Limiting
security.rate-limit.enabled=false
security.rate-limit.requests-per-minute=100
security.rate-limit.burst-capacity=20
security.rate-limit.cleanup-interval=60

# Input Validation
security.validation.enabled=true
security.validation.max-request-size=10MB
security.validation.max-file-size=5MB
security.validation.allowed-file-types=txt,xml,json,pdf
