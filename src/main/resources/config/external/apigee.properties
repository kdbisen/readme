# Apigee Configuration
# ===========================================

# Apigee API URLs
apigee.transformation.endpoint=https://apigee.example.com/transform
apigee.auth.token-service.url=https://apigee.example.com/oauth/token
apigee.base.url=https://apigee.example.com

# Apigee Configuration
apigee.api.version=v1
apigee.timeout.connection=5000
apigee.timeout.read=30000
apigee.timeout.write=30000

# Apigee Authentication
apigee.transformation.auth-scope=transform:read
apigee.auth.client-id=apigee-client-id
apigee.auth.client-secret=apigee-client-secret
apigee.auth.default-scope=default
apigee.auth.cache-enabled=true
apigee.auth.token-cache-ttl=3600

# Apigee Retry Configuration
apigee.retry.enabled=true
apigee.retry.max-attempts=3
apigee.retry.delay-ms=1000
apigee.retry.backoff-multiplier=2.0
apigee.retry.max-delay-ms=10000

# Apigee Rate Limiting
apigee.rate-limit.enabled=true
apigee.rate-limit.requests-per-minute=100
apigee.rate-limit.burst-capacity=20

