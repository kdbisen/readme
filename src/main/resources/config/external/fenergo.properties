# Fenergo Configuration
# ===========================================

# Fenergo API URLs
fenergo.entity.api.url=https://fenergo.example.com/entity
fenergo.logic.engine.url=https://fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema
fenergo.journey.command.url=https://fenergo.example.com/journeycommand/api/journey/launch

# Fenergo Configuration
fenergo.tenant.id=default-tenant
fenergo.journey.type.filter=CLIENT_ONBOARDING
fenergo.api.version=v1
fenergo.timeout.connection=5000
fenergo.timeout.read=30000
fenergo.timeout.write=30000

# Fenergo Authentication
fenergo.auth.token-service.url=https://fenergo.example.com/oauth/token
fenergo.auth.client-id=fenergo-client-id
fenergo.auth.client-secret=fenergo-client-secret
fenergo.auth.default-scope=fenergo:read
fenergo.auth.scope=fenergo:read,fenergo:write
fenergo.auth.cache-enabled=true
fenergo.auth.token-cache-ttl=3600

# Fenergo Retry Configuration
fenergo.retry.enabled=true
fenergo.retry.max-attempts=3
fenergo.retry.delay-ms=1000
fenergo.retry.backoff-multiplier=2.0
fenergo.retry.max-delay-ms=10000
