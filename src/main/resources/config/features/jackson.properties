# Jackson Configuration
# ===========================================

# Serialization Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-null-map-values=false
spring.jackson.serialization.write-empty-json-arrays=false
spring.jackson.serialization.indent-output=false
spring.jackson.serialization.order-entries-by-keys=false

# Deserialization Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-empty-bean=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# Property Inclusion Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.property-naming-strategy=SNAKE_CASE

# Date/Time Configuration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# Mapper Configuration
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jackson.mapper.accept-case-insensitive-properties=true
spring.jackson.mapper.default-view-inclusion=true

# Generator Configuration
spring.jackson.generator.write-numbers-as-strings=false
spring.jackson.generator.quote-non-numeric-numbers=true

