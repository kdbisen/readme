# HTTP Client Configuration
# ===========================================

# RestClient Configuration
restclient.timeout.connection=5000
restclient.timeout.read=30000
restclient.timeout.write=30000
restclient.timeout.call=60000

# Connection Pool Configuration
restclient.connection-pool.max-total=100
restclient.connection-pool.max-per-route=20
restclient.connection-pool.validate-after-inactivity=2000
restclient.connection-pool.keep-alive-timeout=30000

# Retry Configuration
restclient.retry.enabled=true
restclient.retry.max-attempts=3
restclient.retry.delay-ms=1000
restclient.retry.backoff-multiplier=2.0
restclient.retry.max-delay-ms=10000

# Circuit Breaker Configuration
restclient.circuit-breaker.enabled=false
restclient.circuit-breaker.failure-threshold=5
restclient.circuit-breaker.timeout=60000
restclient.circuit-breaker.reset-timeout=30000

# Logging Configuration
restclient.logging.enabled=true
restclient.logging.level=INFO
restclient.logging.log-request-body=true
restclient.logging.log-response-body=true
restclient.logging.log-headers=true
