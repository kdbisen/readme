# Core Application Configuration
# ===========================================

# Application Information
app.name=banking-onboarding-service
app.version=1.0.0
app.description=Banking Onboarding Service for KYC Processing
app.owner=Banking Team
app.contact=banking-team@company.com

# Server Configuration
server.port=8080
server.servlet.context-path=/banking-onboarding
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,env,configprops
management.endpoint.health.show-details=when-authorized
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.env.enabled=true
management.endpoint.configprops.enabled=true

# Application Properties
spring.application.name=${app.name}
spring.main.banner-mode=console
spring.main.log-startup-info=true
spring.main.lazy-initialization=false
