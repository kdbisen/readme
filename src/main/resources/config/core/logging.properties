# Logging Configuration
# ===========================================

# Logging Levels
logging.level.root=INFO
logging.level.com.banking.onboarding=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.boot.context.embedded=WARN

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/banking-onboarding.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.file.total-size-cap=1GB

# Log Categories
logging.level.com.banking.onboarding.controller=INFO
logging.level.com.banking.onboarding.service=INFO
logging.level.com.banking.onboarding.step=INFO
logging.level.com.banking.onboarding.exception=WARN

# Environment Information
ENVIRONMENT=development
APP_VERSION=1.0.0

