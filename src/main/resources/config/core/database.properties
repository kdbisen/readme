# Database Configuration
# ===========================================

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=
spring.data.mongodb.password=

# MongoDB Connection String
MONGODB_URI=mongodb://localhost:27017/banking_onboarding

# MongoDB Connection Pool Settings
spring.data.mongodb.option.connections-per-host=100
spring.data.mongodb.option.min-connections-per-host=10
spring.data.mongodb.option.max-connection-idle-time=60000
spring.data.mongodb.option.max-connection-life-time=0
spring.data.mongodb.option.max-wait-time=120000
spring.data.mongodb.option.connect-timeout=10000
spring.data.mongodb.option.socket-timeout=0

# MongoDB Write Concern
spring.data.mongodb.option.write-concern=acknowledged
spring.data.mongodb.option.read-preference=primary

# MongoDB Index Configuration
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.auto-index-creation-drop-duplicates=true
