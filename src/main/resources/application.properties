# Banking Onboarding Service - Multi-Environment Configuration
# Supports dev, test, staging, and prod environments

# ===========================================
# SPRING CONFIGURATION
# ===========================================
spring.application.name=banking-onboarding-service
spring.profiles.active=dev

# ===========================================
# MULTI-ENVIRONMENT CONFIGURATION
# ===========================================
# Import environment-specific properties based on active profile
spring.config.import=optional:classpath:environments/${spring.profiles.active}/application-${spring.profiles.active}.properties

# Fallback to default properties if environment-specific not found
spring.config.import=${spring.config.import},optional:classpath:server.properties,optional:classpath:mongodb.properties,optional:classpath:logging.properties,optional:classpath:steps.properties,optional:classpath:fenergo-urls.properties,optional:classpath:fenergo-config.properties,optional:classpath:apigee-urls.properties,optional:classpath:apigee-config.properties,optional:classpath:fenergo-auth.properties,optional:classpath:http-client.properties,optional:classpath:jackson.properties

# ===========================================
# ENVIRONMENT CONFIGURATION
# ===========================================
banking.onboarding.environment=${ENVIRONMENT:development}
banking.onboarding.app-version=${APP_VERSION:1.0.0}