# Banking Onboarding Service - Clean Configuration
# Essential properties only

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server.port=8080
server.servlet.context-path=/api/v1

# ===========================================
# MONGODB CONFIGURATION
# ===========================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding
spring.data.mongodb.authentication-database=admin

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging.level.com.banking.onboarding=INFO
logging.level.com.banking.onboarding.logging=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.config=classpath:logback-spring.xml

# Environment variables for logging
ENVIRONMENT=${ENVIRONMENT:dev}
APP_VERSION=${APP_VERSION:1.0.0}

# MongoDB logging configuration
MONGODB_URI=${MONGODB_URI:mongodb://localhost:27017/banking-onboarding}

# ===========================================
# STEP CONFIGURATION - FENERGO FLOW
# ===========================================
onboarding.steps.definition=${ONBOARDING_STEPS_DEFINITION:XML_TO_JSON_TRANSFORMATION,FENERGO_ENTITY_CREATION,FENERGO_JOURNEY_SCHEMA_EVALUATION,FENERGO_JOURNEY_LAUNCH}
onboarding.steps.execution.order=${ONBOARDING_STEPS_EXECUTION_ORDER:PRIORITY}
onboarding.steps.retry.enabled=${ONBOARDING_STEPS_RETRY_ENABLED:true}
onboarding.steps.retry.max-attempts=${ONBOARDING_STEPS_RETRY_MAX_ATTEMPTS:3}
onboarding.steps.retry.delay-ms=${ONBOARDING_STEPS_RETRY_DELAY_MS:1000}
onboarding.steps.retry.backoff-multiplier=${ONBOARDING_STEPS_RETRY_BACKOFF_MULTIPLIER:2.0}
onboarding.steps.timeout-ms=${ONBOARDING_STEPS_TIMEOUT_MS:30000}

# ===========================================
# FENERGO API CONFIGURATION
# ===========================================
fenergo.entity.api.url=${FENERGO_ENTITY_API_URL:https://fenergo.example.com/entity}
fenergo.logic.engine.url=${FENERGO_LOGIC_ENGINE_URL:https://fenergo.example.com/journeylogicengine/api/engine/evaluate-journey-schema}
fenergo.journey.command.url=${FENERGO_JOURNEY_COMMAND_URL:https://fenergo.example.com/api/journey-instance/launch-journey}
fenergo.tenant.id=${FENERGO_TENANT_ID:default-tenant}
fenergo.journey.type.filter=${FENERGO_JOURNEY_TYPE_FILTER:Client Onboarding}

# ===========================================
# APIGEE CONFIGURATION (INTERNAL APIS)
# ===========================================
apigee.transformation.endpoint=${APIGEE_TRANSFORMATION_ENDPOINT:https://apigee-transformation-service.com/api/v1/transform}
apigee.transformation.auth-scope=${APIGEE_TRANSFORMATION_AUTH_SCOPE:transformation-api}
apigee.transformation.timeout=${APIGEE_TRANSFORMATION_TIMEOUT:30000}
apigee.transformation.retry-count=${APIGEE_TRANSFORMATION_RETRY_COUNT:3}

# Apigee Authentication
apigee.auth.token-service.url=${APIGEE_TOKEN_SERVICE_URL:http://apigee-token-service:8080/oauth/token}
apigee.auth.client-id=${APIGEE_CLIENT_ID:apigee-client}
apigee.auth.client-secret=${APIGEE_CLIENT_SECRET:apigee-secret}
apigee.auth.default-scope=${APIGEE_DEFAULT_SCOPE:apigee-api}
apigee.auth.cache-enabled=${APIGEE_CACHE_ENABLED:true}

# ===========================================
# FENERGO AUTHENTICATION (EXTERNAL APIS)
# ===========================================
fenergo.auth.token-service.url=${FENERGO_TOKEN_SERVICE_URL:http://fenergo-token-service:8080/oauth/token}
fenergo.auth.client-id=${FENERGO_CLIENT_ID:fenergo-client}
fenergo.auth.client-secret=${FENERGO_CLIENT_SECRET:fenergo-secret}
fenergo.auth.default-scope=${FENERGO_DEFAULT_SCOPE:fenergo-api}
fenergo.auth.scope=${FENERGO_AUTH_SCOPE:fenergo-api}
fenergo.auth.cache-enabled=${FENERGO_CACHE_ENABLED:true}

# ===========================================
# HTTP CLIENT CONFIGURATION
# ===========================================
restclient.timeout.connect=10000
restclient.timeout.read=30000
restclient.timeout.write=30000

# ===========================================
# MANAGEMENT ENDPOINTS
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===========================================
# JACKSON CONFIGURATION
# ===========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=NON_NULL