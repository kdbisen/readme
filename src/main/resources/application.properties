# Banking Onboarding Service - Organized Configuration Structure
# ================================================================

# Spring Configuration
spring.application.name=banking-onboarding-service
spring.profiles.active=dev

# ===========================================
# ORGANIZED CONFIGURATION IMPORTS
# ===========================================

# Core Configuration (Always loaded)
spring.config.import=optional:classpath:config/core/application-core.properties,optional:classpath:config/core/database.properties,optional:classpath:config/core/logging.properties

# External Services Configuration
spring.config.import=${spring.config.import},optional:classpath:config/external/fenergo.properties,optional:classpath:config/external/apigee.properties

# Security Configuration
spring.config.import=${spring.config.import},optional:classpath:config/security/security.properties

# Monitoring Configuration
spring.config.import=${spring.config.import},optional:classpath:config/monitoring/monitoring.properties

# Features Configuration
spring.config.import=${spring.config.import},optional:classpath:config/features/steps.properties,optional:classpath:config/features/http-client.properties,optional:classpath:config/features/jackson.properties

# Environment-Specific Configuration (Profile-based)
spring.config.import=${spring.config.import},optional:classpath:config/environments/${spring.profiles.active}/application-${spring.profiles.active}.properties

# ===========================================
# ENVIRONMENT CONFIGURATION
# ===========================================
banking.onboarding.environment=${ENVIRONMENT:development}
banking.onboarding.app-version=${APP_VERSION:1.0.0}