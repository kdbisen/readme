# Application Configuration
server.port=8080
server.servlet.context-path=/api/v1

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=banking_onboarding
spring.data.mongodb.authentication-database=admin

# Logging Configuration
logging.level.com.banking.onboarding=INFO
logging.level.com.banking.onboarding.logging=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.integration=INFO
logging.level.org.springframework.data.mongodb=INFO

# Logback configuration
logging.config=classpath:logback-spring.xml

# Environment variables for logging
ENVIRONMENT=${ENVIRONMENT:dev}
APP_VERSION=${APP_VERSION:1.0.0}

# MongoDB logging configuration
MONGODB_URI=${MONGODB_URI:mongodb://localhost:27017/banking-onboarding}

# Apigee API Configuration
apigee.api.base-url=${APIGEE_BASE_URL:http://localhost:8080/apigee}
apigee.api.timeout=${APIGEE_TIMEOUT:30000}
apigee.api.retry-count=${APIGEE_RETRY_COUNT:3}

# Fenergo Proxy Configuration
fenergo.proxy.base-url=${FENERGO_PROXY_BASE_URL:http://localhost:8080/fenergo-proxy}
fenergo.proxy.timeout=${FENERGO_PROXY_TIMEOUT:30000}
fenergo.proxy.retry-count=${FENERGO_PROXY_RETRY_COUNT:3}

# Fenergo Journey Configuration
fenergo.journey.max-retry-attempts=${FENERGO_JOURNEY_MAX_RETRY:3}
fenergo.journey.retry-delay-ms=${FENERGO_JOURNEY_RETRY_DELAY:5000}
fenergo.journey.timeout-ms=${FENERGO_JOURNEY_TIMEOUT:60000}

# Fenergo Integration Configuration
fenergo.api.base-url=http://localhost:8081/fenergo/api
fenergo.api.timeout=30000
fenergo.api.retry-attempts=3

# HTTP Client Configuration
# Options: webclient, apache, okhttp
http.client.type=webclient

# WebClient Configuration
webclient.timeout=30000
webclient.max-in-memory-size=10485760

# Apache HttpClient Configuration
apache.http.max-connections=100
apache.http.max-connections-per-route=20
apache.http.connection-timeout=30000

# OkHttp Configuration
okhttp.connect-timeout=30000
okhttp.read-timeout=30000
okhttp.write-timeout=30000
okhttp.max-idle-connections=10
okhttp.keep-alive-duration=300

# JWT Token Service Configuration (Legacy - will be replaced)
auth.token-service.url=http://localhost:8080/auth/token
auth.token-service.client-id=banking-onboarding-service
auth.token-service.client-secret=secret
auth.token-service.default-scope=fenergo-api
auth.token-service.cache-enabled=true

# Apigee Configuration (Internal Company APIs)
apigee.auth.token-service.url=${APIGEE_TOKEN_SERVICE_URL:http://apigee-token-service:8080/oauth/token}
apigee.auth.client-id=${APIGEE_CLIENT_ID:apigee-client}
apigee.auth.client-secret=${APIGEE_CLIENT_SECRET:apigee-secret}
apigee.auth.default-scope=${APIGEE_DEFAULT_SCOPE:apigee-api}
apigee.auth.cache-enabled=${APIGEE_CACHE_ENABLED:true}

# Fenergo Configuration (External Company APIs)
fenergo.auth.token-service.url=${FENERGO_TOKEN_SERVICE_URL:http://fenergo-token-service:8080/oauth/token}
fenergo.auth.client-id=${FENERGO_CLIENT_ID:fenergo-client}
fenergo.auth.client-secret=${FENERGO_CLIENT_SECRET:fenergo-secret}
fenergo.auth.default-scope=${FENERGO_DEFAULT_SCOPE:fenergo-api}
fenergo.auth.cache-enabled=${FENERGO_CACHE_ENABLED:true}

# Endpoint Configuration
endpoint.config.file=classpath:endpoints.properties
endpoint.config.enabled=true

# Environment-specific endpoint overrides
# Development overrides
endpoint.SUBMIT_KYC.timeoutMs=10000
endpoint.SUBMIT_KYC.retryAttempts=1
endpoint.GET_KYC_STATUS.timeoutMs=5000
endpoint.GET_KYC_STATUS.retryAttempts=1
endpoint.RUN_COMPLIANCE_CHECK.timeoutMs=30000
endpoint.RUN_COMPLIANCE_CHECK.retryAttempts=1

# Proxy Configuration
proxy.base-url=${PROXY_URL:http://localhost:8081}
proxy.health-endpoint=/health
proxy.timeout.connect=5000
proxy.timeout.read=30000
proxy.timeout.write=30000
proxy.auth.enabled=true
proxy.auth.default-type=JWT
proxy.auth.default-scope=fenergo-api

# Fenergo Endpoint Mappings
proxy.endpoints.SUBMIT_KYC.url=${FENERGO_KYC_URL:https://fenergo-api.com/kyc/submit}
proxy.endpoints.SUBMIT_KYC.method=POST
proxy.endpoints.SUBMIT_KYC.auth-type=JWT
proxy.endpoints.SUBMIT_KYC.auth-scope=fenergo-kyc-write
proxy.endpoints.SUBMIT_KYC.timeout=45000
proxy.endpoints.SUBMIT_KYC.retries=3

proxy.endpoints.GET_KYC_STATUS.url=${FENERGO_KYC_STATUS_URL:https://fenergo-api.com/kyc/{entityId}/status}
proxy.endpoints.GET_KYC_STATUS.method=GET
proxy.endpoints.GET_KYC_STATUS.auth-type=JWT
proxy.endpoints.GET_KYC_STATUS.auth-scope=fenergo-kyc-read
proxy.endpoints.GET_KYC_STATUS.timeout=15000
proxy.endpoints.GET_KYC_STATUS.retries=2

proxy.endpoints.RUN_COMPLIANCE_CHECK.url=${FENERGO_COMPLIANCE_URL:https://fenergo-api.com/compliance/check}
proxy.endpoints.RUN_COMPLIANCE_CHECK.method=POST
proxy.endpoints.RUN_COMPLIANCE_CHECK.auth-type=JWT
proxy.endpoints.RUN_COMPLIANCE_CHECK.auth-scope=fenergo-compliance-write
proxy.endpoints.RUN_COMPLIANCE_CHECK.timeout=60000
proxy.endpoints.RUN_COMPLIANCE_CHECK.retries=2

# Endpoint Authentication Configuration
# Format: endpoint.{endpointName}.authRequired=true/false
# Format: endpoint.{endpointName}.authScope=scope-name
endpoint.SUBMIT_KYC.authRequired=true
endpoint.SUBMIT_KYC.authScope=fenergo-kyc-write
endpoint.GET_KYC_STATUS.authRequired=true
endpoint.GET_KYC_STATUS.authScope=fenergo-kyc-read
endpoint.HEALTH_CHECK.authRequired=false
endpoint.API_INFO.authRequired=false

# Process Configuration
process.async.timeout=300000
process.max-concurrent=10

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Additional Proxy Configuration for Fenergo API Calls
fenergo.proxy.url=${FENERGO_PROXY_URL:http://localhost:8080/api/v1/proxy}
apigee.proxy.url=${APIGEE_PROXY_URL:http://localhost:8080/api/v1/proxy}

# Additional Fenergo API Endpoints
fenergo.entity.create.url=${FENERGO_ENTITY_CREATE_URL:https://fenergo.example.com/api/v1/entities}
fenergo.journey.info.url=${FENERGO_JOURNEY_INFO_URL:https://fenergo.example.com/api/v1/journeys/info}
fenergo.journey.initiate.url=${FENERGO_JOURNEY_INITIATE_URL:https://fenergo.example.com/api/v1/journeys/initiate}
fenergo.journey.details.url=${FENERGO_JOURNEY_DETAILS_URL:https://fenergo.example.com/api/v1/journeys/details}

# Additional Apigee API Endpoints
apigee.endpoint.url=${APIGEE_ENDPOINT_URL:https://apigee.example.com/transform}

# RestClient Configuration
restclient.timeout.connect=10000
restclient.timeout.read=30000
restclient.timeout.write=30000
